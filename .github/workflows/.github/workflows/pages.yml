name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: python3 gen.py
      - run: mkdir _site && cp -r index.html ar about contact online-lessons vocal-coaching singing-lessons voice-training piano-lessons oud-lessons guitar-lessons drums-lessons music-theory music-education international-school-music-teacher music-lessons-for-children music-lessons-for-adults sitemap.xml robots.txt _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
